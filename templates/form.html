{% extends "layout/base.html" %}
{% block content %}

<h2 class="h4 mb-3">{{ "Editar producto" if producto else "Nuevo producto" }}</h2>
<form method="post" class="col-12 col-md-6 d-flex flex-column gap-2">
<label for="codigo">Código</label>
<input class="form-control" id="codigo" name="codigo" type="text" required value="{{ producto.codigo if producto else '' }}">
<label for="nombre">Nombre</label>
<input class="form-control" id="nombre" name="nombre" type="text" value="{{ producto.nombre if producto else '' }}">
<label for="categoria">Categoría</label>
<input class="form-control" id="categoria" name="categoria" type="text" value="{{ producto.categoria if producto else '' }}">
<!-- almacena decimales -->
<label for="precio">Precio</label>
<input class="form-control" id="precio" name="precio" type="number"  step="0.01" min="0" value="{{ producto.precio if producto else '' }}">
<label for="existencia">Existencia</label>
<input class="form-control" id="existencia" name="existencia" type="number" min="1" step="1" required value="{{ producto.existencia if producto else '' }}">
<label class="form-check my-2">
<input class="form-check-input" type="checkbox" name="activo" {{ "checked" if (not producto) or producto.activo else "" }}> Activo
</label>
<div class="d-flex gap-2 mt-2">
<button class="btn btn-primary" type="submit">Guardar</button>
<a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Cancelar</a>
</div>
</form>
{% endblock %}
