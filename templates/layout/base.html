<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <!-- estilos personalizados -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<!-- contenido  -->
<main class="container">
    <!-- nav  redireccion -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Gestión de Productos</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Listado</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="ur">Registro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Edición</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Eliminación</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    {% for categoria, mensaje in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ 'danger' if categoria == 'danger' else 'success' }}" role="status">{{ mensaje }}</div>
    {% endfor %}
    {% block content %}
    <!-- redireccion a Listado -->
    <a href="#" class="btn btn-primary">Ir a Listado</a>
    <!-- redireccion a Registro -->
    <a href="#" class="btn btn-secondary">Ir a Registro</a>
    <!-- redireccion a Edición -->
    <a href="#" class="btn btn-success">Ir a Edición</a>
    <!-- redireccion a Eliminación -->
    <a href="#" class="btn btn-danger">Ir a Eliminación</a>
    {% endblock %}
</main>
